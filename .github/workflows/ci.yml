name: CI
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

      - name: prek
        uses: j178/prek-action@53276d8b0d10f8b6672aa85b4588c6921d0370cc # v2.0.1

  wheel:
    name: Build wheel
    strategy:
      fail-fast: false
      matrix:
        include: &platforms
          - { platform: linux-x86_64, runner: ubuntu-latest }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos, runner: macos-latest }
          - { platform: windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    needs: lint
    permissions:
      actions: write # Upload artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm needs the tags to compute the version

      - name: Build wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          output-dir: dist
          extras: uv

      - name: Check the CUDA extension is in the Linux wheel
        if: runner.os == 'Linux'
        run: |
          if ! unzip -l ./dist/*manylinux*.whl | grep -q "torchdtw/_C_cuda.abi3.so"; then
            echo "::error::torchdtw/_C_cuda.abi3.so is missing from the Linux wheel"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-wheel-${{ matrix.platform }}
          path: ./dist/*

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      actions: write # Upload artifact
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm needs the tags to compute the version

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-sdist
          path: ./dist/*

  test:
    name: Test wheel
    strategy:
      fail-fast: false
      matrix:
        include: *platforms
    runs-on: ${{ matrix.runner }}
    needs: wheel
    permissions:
      actions: read # Download artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-wheel-${{ matrix.platform }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install built wheel with test extras
        shell: bash
        run: |
          uv venv
          WHEEL=$(ls ./dist/*.whl)
          uv pip install "${WHEEL}[test]"

      - name: Run tests
        shell: bash
        run: uv run --active --no-sync pytest tests

  abi-floor:
    name: Import against oldest supported PyTorch
    strategy:
      fail-fast: false
      matrix:
        include: *platforms
    runs-on: ${{ matrix.runner }}
    needs: wheel
    permissions:
      actions: read # Download artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-wheel-${{ matrix.platform }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install built wheel against the floor
        shell: bash
        run: |
          uv venv --python 3.12
          WHEEL=$(ls ./dist/*.whl)
          uv pip install torch==2.10.0 "${WHEEL}"
          uv pip show torch | grep -i version

      - name: Import and exercise every backend
        shell: bash
        run: uv run --active --no-sync python tests/smoke_import.py

  cpu-torch:
    name: Test Linux wheel against CPU-only PyTorch
    runs-on: ubuntu-latest
    needs: wheel
    permissions:
      actions: read # Download artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-wheel-linux-x86_64
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"
          enable-cache: false

      # Without libtorch_cuda nor the CUDA runtime, like ROCm builds of PyTorch:
      # the CPU backend must load without the CUDA extension.
      - name: Install built wheel with CPU-only PyTorch
        shell: bash
        run: |
          uv venv
          uv pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          WHEEL=$(ls ./dist/*.whl)
          uv pip install "${WHEEL}[test]"
          uv run --active --no-sync python -c "import torch; assert torch.version.cuda is None, torch.__version__"

      - name: Run tests
        shell: bash
        run: uv run --active --no-sync pytest tests
