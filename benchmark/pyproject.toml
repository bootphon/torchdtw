[project]
name = "dtw-benchmark"
version = "0.1.0"
description = "Benchmark DTW implementations"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Maxime Poli" },
  { name = "CoML", email = "dev@cognitive-ml.fr" },
]
dependencies = [
  "cuda-bindings>=13.5.0,<14",
  "numba>=0.62.1",
  "numba-cuda[cu13]>=0.30.4",
  "numpy>=2.3.4,<2.5",  # numba-cuda 0.30 still uses np.row_stack, removed in numpy 2.5.
  "softdtw-cuda-torch",
  "torch>=2.9.0",
  "torchdtw",
  "tslearn>=0.10.0",
]

[build-system]
requires = [
  "cython>=3.1.6",
  "numpy>=2.3.4",
  "setuptools>=83.0.0",
]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
softdtw-cuda-torch = { git = "https://github.com/BGU-CS-VIL/sdtw-cuda-torch", rev = "f752273f07da14848a69bff132c57ab8e26c40fb" }
torchdtw = { workspace = true }
